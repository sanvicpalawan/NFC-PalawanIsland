# Local / single-host stack for NFC Palawan Island.
#
#   cp .env.example .env        # then set DATABASE_URL and ADMIN_SESSION_SECRET
#   docker compose up -d --build
#   docker compose exec web npm run db:push
#   docker compose exec web npm run db:seed
#
# Compose reads the values below from `.env`. ADMIN_SESSION_SECRET has no
# default on purpose: the stack refuses to start without it.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app_db}}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET must be set in .env (32+ characters)}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ADMIN_AUTH_DISABLED: ${ADMIN_AUTH_DISABLED:-false}
      NODE_ENV: production
    volumes:
      # Uploaded media is container-local; keep it across rebuilds.
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
