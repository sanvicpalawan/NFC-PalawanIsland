name: Bug report
description: Something is broken or behaving unexpectedly
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Admin portal
        - API / database
        - Build or deployment
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where you saw this.
      placeholder: Local dev / staging / production, Node version, browser
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact any secrets, tokens or customer data before pasting.
    validations:
      required: false
