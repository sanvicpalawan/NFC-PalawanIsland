name: Feature request
description: Propose a change or a new capability
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe the situation today and who it affects. Avoid jumping to a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like to happen.
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits
      options:
        - Guests / end customers
        - Venue staff
        - The operator team
        - Developers
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including doing nothing, or handling it manually.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This can be achieved without a new paid service or subscription
          required: false
